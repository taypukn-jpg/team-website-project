<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Қазақстан туризм</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
</head>
<body>
    <header>
        <h1 id="site-title">Қазақстандағы Танымал Туристік Орындар</h1>
        <div id="lang-switcher">
            <button class="lang-btn" data-lang="kk">KZ</button>
            <button class="lang-btn" data-lang="ru">RU</button>
            <button class="lang-btn" data-lang="en">EN</button>
        </div>
    </header>

    <!-- Фильтр -->
    <section id="filter">
        <h2>Фильтр</h2>
        <button data-type="all">Барлығы</button>
        <button data-type="тау">Тау</button>
        <button data-type="өзен">Өзен</button>
        <button data-type="қала">Қала</button>
    </section>

    <!-- Галерея -->
    <section id="gallery">
        <h2>Галерея</h2>
        <div class="places" id="places">
            <!-- JS будет заполнять места -->
        </div>
    </section>

    <!-- Слайдер -->
    <section id="slider">
        <h2>Танымал орындар</h2>
        <div class="slide-container">
            <img id="slide-image" src="images/altai.jpg" alt="">
            <p id="slide-caption">Алтай таулары – керемет табиғат көрінісі.</p>
            <button id="prev">◀</button>
            <button id="next">▶</button>
        </div>
    </section>

    <!-- Сүйікті орындар -->
    <section id="favorites">
        <h2>Сүйікті орындар</h2>
        <ul id="fav-list"></ul>
    </section>

    <!-- Карта -->
    <section id="map">
        <h2>Қазақстан картасы</h2>
        <div id="mapid" style="height: 400px;"></div>
    </section>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
